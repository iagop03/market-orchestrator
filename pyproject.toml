[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-orchestrator"
version = "0.1.0"
description = "Validates discovered niches and hands viable ones to antcrew to build"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyGithub>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "black>=23.0", "fastapi>=0.110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
market-orchestrator = "orchestrator.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
